<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1584" viewBox="0 0 1240 1584">
<defs><marker id="ah" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#22303c"/></marker></defs>
<rect width="1240" height="1584" fill="#ffffff"/>
<text x="620.0" y="44" font-family="NanumGothic, sans-serif" font-size="21" fill="#22303c" text-anchor="middle" font-weight="bold" >RLPx / X-Wing 핸드셰이크 성능 측정 흐름도  (Linux netns+netem · TCP 기반)</text><text x="620.0" y="70" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#8a97a3" text-anchor="middle" font-weight="normal" >주입 지연 RTT = 0 / 10 / 30 / 50 ms · 각 방향 delay=RTT/2 · 대각선 화살표 = 네트워크 전파(≈RTT/2)</text><rect x="150" y="95" width="940" height="52" rx="10" fill="#f5f7f9" stroke="#c9d2da" stroke-width="1.2" stroke-dasharray="6 4"/><text x="620.0" y="118" font-family="NanumGothic, sans-serif" font-size="14" fill="#8a97a3" text-anchor="middle" font-weight="bold" >① 노드 탐색(discovery)·ping = UDP 디스커버리 — 연결 전에 이미 완료됨</text><text x="620.0" y="137" font-family="NanumGothic, sans-serif" font-size="12" fill="#8a97a3" text-anchor="middle" font-weight="normal" >측정 하네스가 admin_addPeer로 상대 enode를 미리 지정 → peerTotal 측정에는 포함되지 않음</text><rect x="220" y="158" width="280" height="36" rx="9" fill="#eef4fb" stroke="#3B6FB6" stroke-width="1.4" /><text x="360" y="182" font-family="NanumGothic, sans-serif" font-size="14" fill="#3B6FB6" text-anchor="middle" font-weight="bold" >Node1 · 개시자(initiator) · ns1 10.0.0.1</text><rect x="740" y="158" width="280" height="36" rx="9" fill="#fdf1e5" stroke="#E0812B" stroke-width="1.4" /><text x="880" y="182" font-family="NanumGothic, sans-serif" font-size="14" fill="#E0812B" text-anchor="middle" font-weight="bold" >Node2 · 응답자(responder) · ns2 10.0.0.2</text><line x1="360" y1="200" x2="360" y2="1120" stroke="#3B6FB6" stroke-width="2.5"/><line x1="880" y1="200" x2="880" y2="1120" stroke="#E0812B" stroke-width="2.5"/><text x="360" y="215" font-family="NanumGothic, sans-serif" font-size="12" fill="#3B6FB6" text-anchor="middle" font-weight="normal" font-style="italic">◀ Node1 자기 시계로 측정</text><text x="880" y="215" font-family="NanumGothic, sans-serif" font-size="12" fill="#E0812B" text-anchor="middle" font-weight="normal" font-style="italic">Node2 자기 시계로 측정 ▶</text><circle cx="360" cy="245" r="6" fill="#3B6FB6"/><text x="346" y="241" font-family="NanumGothic, sans-serif" font-size="15" fill="#3B6FB6" text-anchor="end" font-weight="bold" >T0</text><text x="346" y="258" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#22303c" text-anchor="end" font-weight="normal" >connect() 직전 · ★측정 시작</text><line x1="360" y1="262" x2="880" y2="302" stroke="#22303c" stroke-width="2"  marker-end="url(#ah)"/><text x="620.0" y="274.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#22303c" text-anchor="middle" font-weight="bold" >① SYN</text><text x="620.0" y="298.0" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" font-style="italic">≈ RTT/2</text><line x1="880" y1="315" x2="360" y2="355" stroke="#22303c" stroke-width="2"  marker-end="url(#ah)"/><text x="620.0" y="327.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#22303c" text-anchor="middle" font-weight="bold" >SYN-ACK</text><text x="620.0" y="351.0" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" font-style="italic">≈ RTT/2</text><line x1="360" y1="368" x2="880" y2="408" stroke="#22303c" stroke-width="2"  marker-end="url(#ah)"/><text x="620.0" y="380.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#22303c" text-anchor="middle" font-weight="bold" >ACK</text><text x="620.0" y="404.0" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" font-style="italic">≈ RTT/2</text><circle cx="360" cy="372" r="6" fill="#3B6FB6"/><text x="346" y="368" font-family="NanumGothic, sans-serif" font-size="15" fill="#3B6FB6" text-anchor="end" font-weight="bold" >T1</text><text x="346" y="385" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#22303c" text-anchor="end" font-weight="normal" >channelActive = TCP 3-way 완료</text><text x="346" y="402" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="end" font-weight="normal" font-style="italic">(이 구간에 firstMessage 암호연산 prep 포함)</text><circle cx="360" cy="430" r="6" fill="#3B6FB6"/><text x="346" y="426" font-family="NanumGothic, sans-serif" font-size="15" fill="#3B6FB6" text-anchor="end" font-weight="bold" >T2</text><text x="346" y="443" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#22303c" text-anchor="end" font-weight="normal" >Auth 전송</text><line x1="360" y1="442" x2="880" y2="484" stroke="#3B6FB6" stroke-width="2"  marker-end="url(#ah)"/><text x="620.0" y="455.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#3B6FB6" text-anchor="middle" font-weight="bold" >② Auth  [XWpk_I, XWpk_eph, CT_R, n_I] ~3597B(RLP본문)</text><text x="620.0" y="479.0" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" font-style="italic">≈ RTT/2</text><circle cx="880" cy="484" r="6" fill="#E0812B"/><text x="894" y="480" font-family="NanumGothic, sans-serif" font-size="14" fill="#E0812B" text-anchor="start" font-weight="bold" >Auth 수신</text><text x="894" y="497" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#E0812B" text-anchor="start" font-weight="normal" >★respAKE 시작(Node2 시계)</text><rect x="760.0" y="506" width="240" height="34" rx="7" fill="#fdf1e5" stroke="#E0812B" stroke-width="1.3" /><text x="880" y="527.0" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#E0812B" text-anchor="middle" font-weight="bold" >응답자 연산: ACK 캡슐화 계산</text><line x1="880" y1="562" x2="360" y2="604" stroke="#E0812B" stroke-width="2"  marker-end="url(#ah)"/><text x="620.0" y="575.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#E0812B" text-anchor="middle" font-weight="bold" >③ ACK  [CT_I, CT_E, tag_R, n_R] ~2315B(RLP본문)</text><text x="620.0" y="599.0" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" font-style="italic">≈ RTT/2</text><circle cx="360" cy="604" r="6" fill="#3B6FB6"/><text x="346" y="600" font-family="NanumGothic, sans-serif" font-size="15" fill="#3B6FB6" text-anchor="end" font-weight="bold" >T5</text><text x="346" y="617" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#22303c" text-anchor="end" font-weight="normal" >첫 inbound = ACK 수신</text><rect x="235.0" y="626" width="250" height="34" rx="7" fill="#eef4fb" stroke="#3B6FB6" stroke-width="1.3" /><text x="360" y="647.0" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#3B6FB6" text-anchor="middle" font-weight="bold" >개시자 연산: 세션키 도출 + tag_R 검증</text><circle cx="360" cy="682" r="6" fill="#3B6FB6"/><text x="346" y="678" font-family="NanumGothic, sans-serif" font-size="15" fill="#3B6FB6" text-anchor="end" font-weight="bold" >T6a</text><text x="346" y="695" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#22303c" text-anchor="end" font-weight="normal" >SUCCESS = 개시자 key-ready</text><line x1="360" y1="696" x2="880" y2="738" stroke="#3B6FB6" stroke-width="2"  marker-end="url(#ah)"/><text x="620.0" y="709.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#3B6FB6" text-anchor="middle" font-weight="bold" >④ Conf  [tag_I]</text><text x="620.0" y="733.0" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" font-style="italic">≈ RTT/2</text><rect x="760.0" y="744" width="240" height="34" rx="7" fill="#fdf1e5" stroke="#E0812B" stroke-width="1.3" /><text x="880" y="765.0" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#E0812B" text-anchor="middle" font-weight="bold" >응답자: tag_I 검증 → SUCCESS</text><circle cx="880" cy="796" r="6" fill="#E0812B"/><text x="894" y="792" font-family="NanumGothic, sans-serif" font-size="14" fill="#E0812B" text-anchor="start" font-weight="bold" >SUCCESS</text><text x="894" y="809" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#E0812B" text-anchor="start" font-weight="normal" >★respAKE 끝(Node2 시계) = 상호 명시적 키확인 완료</text><line x1="150" y1="826" x2="1150" y2="826" stroke="#c9d2da" stroke-width="1" stroke-dasharray="3 4"/><text x="160" y="820" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#8a97a3" text-anchor="start" font-weight="bold" >⑤ AKE 완료 → 세션키로 프레이머 구성 후 암호화된 Hello(P2P capability 협상) 교환</text><line x1="880" y1="842" x2="360" y2="884" stroke="#E0812B" stroke-width="2"  marker-end="url(#ah)"/><text x="620.0" y="855.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#E0812B" text-anchor="middle" font-weight="bold" >Hello (암호화 프레임)</text><text x="620.0" y="879.0" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" font-style="italic">≈ RTT/2</text><line x1="360" y1="892" x2="880" y2="934" stroke="#3B6FB6" stroke-width="2"  marker-end="url(#ah)"/><text x="620.0" y="905.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#3B6FB6" text-anchor="middle" font-weight="bold" >Hello (암호화 프레임)</text><text x="620.0" y="929.0" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" font-style="italic">≈ RTT/2</text><circle cx="360" cy="936" r="6" fill="#3B6FB6"/><text x="346" y="932" font-family="NanumGothic, sans-serif" font-size="15" fill="#3B6FB6" text-anchor="end" font-weight="bold" >T7</text><text x="346" y="949" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#22303c" text-anchor="end" font-weight="normal" >상대 Hello 복호 + nodeId 일치 검증 통과</text><circle cx="360" cy="976" r="6" fill="#3B6FB6"/><text x="346" y="972" font-family="NanumGothic, sans-serif" font-size="15" fill="#3B6FB6" text-anchor="end" font-weight="bold" >T8</text><text x="346" y="989" font-family="NanumGothic, sans-serif" font-size="12.5" fill="#22303c" text-anchor="end" font-weight="normal" >peer 확립 · ★측정 끝</text><path d="M128,245 h-8 v731 h8" fill="none" stroke="#3B6FB6" stroke-width="2"/><text x="96" y="610.5" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#3B6FB6" text-anchor="middle" font-weight="bold" transform="rotate(-90 96 610.5)">peerTotal (T8-T0)  ~3×RTT</text><path d="M188,245 h-8 v127 h8" fill="none" stroke="#22303c" stroke-width="2"/><text x="164" y="308.5" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#22303c" text-anchor="middle" font-weight="bold" transform="rotate(-90 164 308.5)">setup (T1-T0)</text><path d="M248,372 h-8 v310 h8" fill="none" stroke="#3B6FB6" stroke-width="2"/><text x="224" y="527.0" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#3B6FB6" text-anchor="middle" font-weight="bold" transform="rotate(-90 224 527.0)">keyReady (T6a-T1)</text><path d="M308,430 h-8 v174 h8" fill="none" stroke="#22303c" stroke-width="2"/><text x="286" y="517.0" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#22303c" text-anchor="middle" font-weight="bold" transform="rotate(-90 286 517.0)">AuthAckRTT (T5-T2)</text><path d="M1172,484 h8 v312 h-8" fill="none" stroke="#E0812B" stroke-width="2"/><text x="1196" y="640.0" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#E0812B" text-anchor="middle" font-weight="bold" transform="rotate(90 1196 640.0)">respAKE (T6a-T5) · Node2</text><text x="1170" y="330" font-family="NanumGothic, sans-serif" font-size="12" fill="#8a97a3" text-anchor="middle" font-weight="bold" >왕복①</text><text x="1170" y="346" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" >TCP</text><text x="1170" y="520" font-family="NanumGothic, sans-serif" font-size="12" fill="#8a97a3" text-anchor="middle" font-weight="bold" >왕복②</text><text x="1170" y="536" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" >AKE</text><text x="1170" y="886" font-family="NanumGothic, sans-serif" font-size="12" fill="#8a97a3" text-anchor="middle" font-weight="bold" >왕복③</text><text x="1170" y="902" font-family="NanumGothic, sans-serif" font-size="11" fill="#8a97a3" text-anchor="middle" font-weight="normal" >Hello</text><rect x="60" y="1160" width="1120" height="4" rx="0" fill="#3B6FB6" stroke="#3B6FB6" stroke-width="0" /><text x="80" y="1194" font-family="NanumGothic, sans-serif" font-size="17" fill="#22303c" text-anchor="start" font-weight="bold" >측정 구간 정의 · 기준 시계 · RTT 의존성</text><text x="80" y="1218" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#8a97a3" text-anchor="start" font-weight="bold" >지표</text><text x="300" y="1218" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#8a97a3" text-anchor="start" font-weight="bold" >구간</text><text x="760" y="1218" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#8a97a3" text-anchor="start" font-weight="bold" >시계</text><text x="900" y="1218" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#8a97a3" text-anchor="start" font-weight="bold" >RTT 의존</text><rect x="70" y="1224" width="1100" height="30" rx="6" fill="#f7fafd" stroke="#f7fafd" stroke-width="0" /><text x="80" y="1244" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#3B6FB6" text-anchor="start" font-weight="bold" >prep (Tb-Ta)</text><text x="300" y="1244" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >firstMessage 암호연산 (Auth 생성 등)</text><text x="760" y="1244" font-family="NanumGothic, sans-serif" font-size="13" fill="#3B6FB6" text-anchor="start" font-weight="bold" >Node1</text><text x="900" y="1244" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >무관(고정)</text><text x="80" y="1278" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#3B6FB6" text-anchor="start" font-weight="bold" >pureTCP (T1-Tb)</text><text x="300" y="1278" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >순수 TCP 왕복 구간</text><text x="760" y="1278" font-family="NanumGothic, sans-serif" font-size="13" fill="#3B6FB6" text-anchor="start" font-weight="bold" >Node1</text><text x="900" y="1278" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >~1×RTT</text><rect x="70" y="1292" width="1100" height="30" rx="6" fill="#f7fafd" stroke="#f7fafd" stroke-width="0" /><text x="80" y="1312" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#3B6FB6" text-anchor="start" font-weight="bold" >setup (T1-T0)</text><text x="300" y="1312" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >connect직전 → TCP연결완료 (prep 포함)</text><text x="760" y="1312" font-family="NanumGothic, sans-serif" font-size="13" fill="#3B6FB6" text-anchor="start" font-weight="bold" >Node1</text><text x="900" y="1312" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >~1×RTT</text><text x="80" y="1346" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#3B6FB6" text-anchor="start" font-weight="bold" >AuthAckRTT (T5-T2)</text><text x="300" y="1346" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >Auth 전송 → ACK 수신</text><text x="760" y="1346" font-family="NanumGothic, sans-serif" font-size="13" fill="#3B6FB6" text-anchor="start" font-weight="bold" >Node1</text><text x="900" y="1346" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >~1×RTT</text><rect x="70" y="1360" width="1100" height="30" rx="6" fill="#f7fafd" stroke="#f7fafd" stroke-width="0" /><text x="80" y="1380" font-family="NanumGothic, sans-serif" font-size="13.5" fill="#3B6FB6" text-anchor="start" font-weight="bold" >keyReady (T6a-T1)</text><text x="300" y="1380" font-family="NanumGothic, sans-serif" font-size="13" fill="#22303c" text-anchor="start" font-weight="normal" >TCP완료 → 개시자 세션키 